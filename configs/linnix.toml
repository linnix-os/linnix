# Linnix Configuration
# Documentation: https://docs.linnix.io/configuration

[api]
listen_addr = "127.0.0.1:3000"
# Non-loopback API binds require LINNIX_API_TOKEN or this setting.
# Prefer LINNIX_API_TOKEN in production so the token is not stored in this file.
# auth_token = "your-secret-token"

[runtime]
offline = false

[telemetry]
# How often the CPU/memory snapshot is refreshed (100..=60000)
sample_interval_ms = 5000

# How long process history is kept before pruning (10..=3600)
retention_seconds = 300

# Events/sec below which snapshots are not forwarded to handlers
min_eps_to_enable = 20

[reasoner]
# AI-powered incident detection
enabled = true
endpoint = "http://localhost:8090/v1/chat/completions"
model = "linnix-3b-distilled"
timeout_ms = 30000

[outputs]
# Serve Prometheus, health, and readiness on a separate operational listener.
prometheus = true
metrics_listen_addr = "127.0.0.1:9464"

# ─────────────────────────────────────────────────────────────────────────────
# Notifications via Apprise (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Apprise supports 100+ services: Slack, Discord, Teams, Telegram, SMS, Email, etc.
# See https://github.com/caronc/apprise#supported-notifications for URL formats
#
# [notifications.apprise]
# urls = [
#     "slack://xoxb-YOUR-BOT-TOKEN/C0123456789",
#     "discord://WEBHOOK_ID/WEBHOOK_TOKEN",
#     "mailto://user:pass@smtp.gmail.com"
# ]
# min_severity = "medium"  # Options: info, low, medium, high (default: info)
#
# [notifications.slack]
# webhook_url = "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
# signing_secret = "YOUR-SLACK-SIGNING-SECRET"  # Or set LINNIX_SLACK_SIGNING_SECRET.
# dashboard_base_url = "http://localhost:3000"

[psi]
# Duration in seconds of sustained pressure required to trigger attribution
sustained_pressure_seconds = 15
# Stall attributed to a single offender, in milliseconds, before it is reported.
# A large stall spread thinly across many neighbours is not a noisy neighbour.
attribution_threshold_ms = 100
# How long before the same offender/victim pair is reported again. Pressure
# lasting an hour would otherwise alert every sustained_pressure_seconds for the
# whole hour. Set to 0 to report every occurrence; the Prometheus counters are
# unaffected either way.
attribution_cooldown_seconds = 300

[incidents]
# Days of incident history to keep in the incident store. Rows older than
# this are pruned once a day (and once shortly after startup). 0 or unset
# disables pruning and keeps incidents forever.
retention_days = 30

[cloud]
# Opt-in shipment of evidence batches to the Linnix Cloud edge (v1 event
# schema). Disabled by default: with `enabled = false` (or the section
# absent) no cloud task starts and no network traffic occurs.
enabled = false
# Edge ingest URL. Required when enabled. Plain http:// is rejected for
# non-loopback hosts so the bearer token never travels unencrypted.
# endpoint = "https://ingest.example.com/v1/event-batches"
# Opaque cloud organization/tenant ID. Required when enabled; the edge also
# derives the tenant from the token and rejects a mismatched body.
# tenant_id = "tn_123"
# Stable cluster identity. Optional: when unset the daemon generates one and
# persists it, but every node then gets its own — set this explicitly (e.g.
# via Helm) for real clusters.
# cluster_id = "prod-eu-west"
# Stable node identity. Optional override; otherwise NODE_NAME, then
# HOSTNAME, then the OS hostname. The first resolved value is persisted, so
# later renames don't fork the node's identity.
# node_id = "node-42"
# Bearer token for the edge. Prefer the LINNIX_CLOUD_TOKEN environment
# variable over writing it into this file; the env var wins when both are set.
# bearer_token = "..."
# Export process identity (comm, PIDs, cmdline, executable and cgroup paths)
# inside detection details. Default false: those fields are scrubbed and the
# edge never sees them. Secrets and environment blocks are always scrubbed.
# export_process_identity = false
