# Linnix Configuration for macOS/Docker Desktop
# This config is used automatically when running on macOS
# Key difference: binds to 0.0.0.0 instead of 127.0.0.1 for bridge networking

[api]
listen_addr = "0.0.0.0:3000"  # Bind to all interfaces for macOS bridge network
# Required for this non-loopback bind: set LINNIX_API_TOKEN in the environment.
# auth_token = "your-secret-token"

[runtime]
offline = false

[telemetry]
# How often the CPU/memory snapshot is refreshed (100..=60000)
sample_interval_ms = 5000

# How long process history is kept before pruning (10..=3600)
retention_seconds = 300

# Events/sec below which snapshots are not forwarded to handlers
min_eps_to_enable = 20

[reasoner]
# AI-powered incident detection
enabled = true
endpoint = "http://llama-server:8090/v1/chat/completions"  # Use service name for bridge network
model = "linnix-3b-distilled"
timeout_ms = 30000

[outputs]
# Serve Prometheus, health, and readiness on a separate operational listener.
prometheus = true
metrics_listen_addr = "127.0.0.1:9090"

[probes]
# eBPF probe configuration
btf_path = "/sys/kernel/btf/vmlinux"

[circuit_breaker]
enabled = true
mode = "monitor"  # Options: monitor, enforce
psi_threshold = 40.0
cpu_threshold = 90.0
sustained_seconds = 15
