apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linnix-agent
  namespace: default
  labels:
    app: linnix
spec:
  selector:
    matchLabels:
      app: linnix
  template:
    metadata:
      labels:
        app: linnix
      annotations:
        # Picked up by Prometheus' standard kubernetes-pods scrape job. Without
        # these the endpoint is served but never collected, so the dashboard
        # stays empty. Prometheus Operator users should add a PodMonitor
        # instead; these annotations are ignored by it.
        #
        # Metrics are intentionally exposed only by the operational listener;
        # the host-privileged API listener on 3000 always requires a token.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics/prometheus"
    spec:
      serviceAccountName: linnix-agent
      hostPID: true  # Required to monitor host processes
      containers:
        - name: cognitod
          image: ghcr.io/linnix-os/cognitod:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true  # Simplest for eBPF. Can be refined with caps.
            # capabilities:
            #   add: ["BPF", "PERFMON", "SYS_RESOURCE", "SYS_ADMIN"]
          env:
            # Required for the non-loopback API listener. Do not put this
            # token in the ConfigMap.
            - name: LINNIX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linnix-api-token
                  key: token
            # Downward API: the node's name. The agent prefers NODE_NAME over
            # HOSTNAME when resolving its identity, so the persisted
            # cloud_identity.json (and its batch sequence / export watermark)
            # stays bound to the *node* across pod restarts instead of
            # following the pod's hostname.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/linnix
              readOnly: true
            - name: sys-btf
              mountPath: /sys/kernel/btf/vmlinux
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
            # Durable per-node state: the incident DB, cloud_identity.json
            # (agent instance ID, batch sequence, export watermark) and the
            # cloud_spool/ batch queue all live under /var/lib/linnix (the
            # daemon's default state dir; see LINNIX_INCIDENT_DB). Without
            # this, every pod restart mints a new agent_instance_id, resets
            # the batch sequence, and drops queued batches — breaking the
            # edge's gap detector and idempotency keys.
            - name: state
              mountPath: /var/lib/linnix
            # Mount host /proc to monitor processes
            # Note: In container, this might be mounted at /host/proc if configured,
            # but standard hostPID: true makes /proc the host's /proc?
            # No, hostPID: true means we see host PIDs in our /proc.
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
          ports:
            - containerPort: 3000
              name: api
            - containerPort: 9464
              name: metrics
          # Liveness only asks "is the process alive?". It deliberately does NOT
          # check eBPF: a kernel that cannot load our programs never will, so
          # failing liveness would CrashLoopBackOff and bury the real reason.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness reflects whether this agent is actually producing
          # per-process stall attribution. A node below the kernel floor
          # (5.12+ x86_64 / 5.18+ arm64), without BTF, or missing CAP_BPF runs
          # userspace-only -- it stays up but collects nothing useful, and shows
          # as 0/1 Ready instead of silently looking healthy.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: linnix-config
        - name: sys-btf
          hostPath:
            path: /sys/kernel/btf/vmlinux
            type: File
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        # hostPath is the simplest correct choice for a DaemonSet: one pod
        # per node, so node-local storage is exactly the right scope — no
        # PVC provisioning or storage class needed. DirectoryOrCreate so a
        # fresh node comes up without manual provisioning. Security note:
        # the agent runs privileged and writes its DB/spool here; restrict
        # host access to /var/lib/linnix to the same administrators who can
        # already read the node's disk.
        - name: state
          hostPath:
            path: /var/lib/linnix
            type: DirectoryOrCreate
