name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-unit:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run unit tests
        run: cargo nextest run --workspace --profile default

  test-e2e:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run end-to-end tests
        run: cargo nextest run --workspace --profile e2e --config-file nextest.toml

  lint-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Audit dependencies
        run: cargo deny check

  test-ebpf:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust (nightly for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2024-12-10
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 20
        if: matrix.runner == 'ubuntu-latest'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev
          echo "LLVM_SYS_200_PREFIX=/usr/lib/llvm-20" >> $GITHUB_ENV
      - name: Install bpf-linker
        if: matrix.runner == 'ubuntu-latest'
        run: cargo install bpf-linker --version 0.9.13 --locked
      - name: Install bpf-linker (prebuilt, aarch64)
        # v0.9.13 has no aarch64 release binary and building it from source via the
        # rustc LLVM proxy crashes (LLVMInitializeBPFTarget panic) on arm64 runners.
        if: matrix.runner == 'ubuntu-22.04-arm'
        run: |
          curl -sSL -o bpf-linker.tar.zst https://github.com/aya-rs/bpf-linker/releases/download/v0.10.4/bpf-linker-aarch64-unknown-linux-musl.tar.zst
          tar --zstd -xf bpf-linker.tar.zst
          sudo install -m 755 "$(find . -maxdepth 2 -type f -name bpf-linker)" /usr/local/bin/bpf-linker
      - name: Build eBPF artifacts
        run: cargo xtask build-ebpf

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documentation against code
        run: python3 scripts/validate_docs.py --workspace .
      - name: Validate package assets
        run: python3 scripts/validate_package_assets.py
      - name: Run Python regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
