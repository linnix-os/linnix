name: CLA Assistant

# Asks every outside contributor to sign CLA.md once, by commenting on their
# pull request. Signatures are committed to the `cla-signatures` branch, so
# the bot never pushes to main.
#
# pull_request_target is the documented trigger for this action: it needs a
# write token on PRs from forks. This workflow never checks out or runs PR
# code, which is what keeps that safe. Do not add a checkout step.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # v2.6.1, pinned by commit SHA.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/linnix-os/linnix/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # Maintainer accounts and bots. Everyone else signs.
          allowlist: parth21shah,dependabot[bot],github-actions[bot],renovate[bot]
