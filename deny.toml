[advisories]
yanked = "warn"

# Each ignore names why the advisory does not apply or what unblocks the fix.
# Revisit on every dependency bump; remove an entry once it stops matching.

[[advisories.ignore]]
id = "RUSTSEC-2026-0459"
reason = "Bundled SQLite in libsqlite3-sys 0.30 (via sqlx 0.8). Exploit needs a crafted DB + -wal pair; cognitod only opens its own DB under /var/lib/linnix, writable only by node root. Fix requires sqlx 0.9 (Rust 1.94; Dockerfile is on 1.93)."

[[advisories.ignore]]
id = "RUSTSEC-2026-0543"
reason = "chrono unmaintained, no fixed release. Direct dep of cognitod, linnix-reasoner, xtask-lab; migrating to jiff/time is tracked separately."

[[advisories.ignore]]
id = "RUSTSEC-2024-0449"
reason = "unsafe-libyaml unmaintained, pulled in by deprecated serde_yaml 0.9 (rules.yaml parsing). Replacement is tracked separately."

[[advisories.ignore]]
id = "RUSTSEC-2026-0441"
reason = "pin-utils unmaintained, transitive via futures-util (axum, futures). No action available downstream."

[licenses]
# Only these SPDX licenses are allowed; everything else fails.
allow = [
  "Apache-2.0",
  "AGPL-3.0-or-later",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",                  # <- NEW: for foldhash
  "CDLA-Permissive-2.0",   # <- NEW: for webpki-roots
  "CC0-1.0",               # Creative Commons Zero — tiny-keccak
]
# (Optional) warn if you listed a license above that doesn't actually appear
unused-allowed-license = "warn"

[[licenses.exceptions]]
name = "linnix-ai-ebpf-common"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "linnix-reasoner"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "cognitod"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "xtask"
allow = ["AGPL-3.0-or-later"]

[sources]
unknown-git = "deny"
allow-git = ["https://github.com/aya-rs/aya"]

[bans]
multiple-versions = "warn"
deny = []
